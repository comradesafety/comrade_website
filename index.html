<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/assets/logo/comrade-logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#FBF3E6" />
    <title>Comrade — Comrades Born to Defy</title>
    <meta
      name="description"
      content="Comrade is an emerging personal safety technology company designing intelligent everyday products — built to blend naturally into the way you live, move, and explore."
    />
    <meta name="robots" content="index, follow" />

    <!-- Single Page App routing script for GitHub Pages -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Comrade — Comrades Born to Defy" />
    <meta
      property="og:description"
      content="Personal safety, reimagined. Comrade is rethinking personal safety through intelligent everyday products."
    />
    <meta property="og:image" content="/assets/logo/comrade-logo.png" />

    <!-- Fonts: Space Grotesk for display type, Inter for body copy -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-cream-100 text-ink-900 antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
